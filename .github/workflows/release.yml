name: Release

# A new version number in package.json makes a new release, with its notes taken from CHANGELOG.md.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Version
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          grep -q "ROOST_VERSION = \"$V\"" dist/roost-cards.js || { echo "dist/roost-cards.js does not say version $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Release (only if this version is new)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V is already released."
            exit 0
          fi
          python3 .github/scripts/release_notes.py "$V" > notes.md
          gh release create "v$V" dist/roost-cards.js --title "Roost Cards $V" --notes-file notes.md --target "$GITHUB_SHA"
